version: "3.8"

services:
  influxdb:
    image: influxdb:2.7
    container_name: macro_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-admin123456}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-stockdashboard}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-macro_indicators}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-macro_dashboard_token_2026}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  grafana:
    image: grafana/grafana:10.4.0
    container_name: macro_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin123}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/macro_bubble_indicators.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy

  collector:
    build:
      context: ./data-collector
    container_name: macro_collector
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-macro_dashboard_token_2026}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-stockdashboard}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-macro_indicators}
      - FRED_API_KEY=${FRED_API_KEY:-}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: "no"

volumes:
  influxdb_data:
  grafana_data:
